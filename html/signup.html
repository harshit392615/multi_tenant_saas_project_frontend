<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your Nexus account to start collaborating.">
    <title>Sign up - Nexus</title>
    <link rel="stylesheet" href="../css/signup.css">
</head>
<body>

<main class="auth-container">
    <div class="auth-card">
        <header class="auth-header">
            <a href="index.html" class="logo">
                <div class="logo-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M14 6L10 18M6 6H8L10 12L12 6H14V18H12L10 12L8 18H6V6Z" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <span class="logo-text">Nexus</span>
            </a>
            <h1 id="headerTitle">Create your account</h1>
        </header>

        <div id="signupFormContainer">
            <form id="signupForm" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="username">Full Name</label>
                    <input type="text" id="username" name="username" placeholder="Jane Doe" required>
                    <span class="error-msg" id="usernameError" aria-live="polite"></span>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="jane@example.com" required>
                    <span class="error-msg" id="emailError" aria-live="polite"></span>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" placeholder="Minimum 8 characters" required>
                        <button type="button" class="toggle-password" data-target="password" aria-label="Show password">👁</button>
                    </div>
                    <span class="error-msg" id="passwordError" aria-live="polite"></span>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password" required>
                        <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="Show password">👁</button>
                    </div>
                    <span class="error-msg" id="confirmPasswordError" aria-live="polite"></span>
                </div>

                <button type="submit" class="btn btn--primary full-width">Sign up</button>

                <div id="formStatus" class="form-status" role="alert"></div>
            </form>

            <footer class="auth-footer">
                <p>Already have an account? <a href="login.html" class="link-primary">Log in</a></p>
            </footer>
        </div>

        <div id="successScreen" class="success-screen" style="display: none;">
            <div class="success-icon">✉️</div>
            <h2>Check your email</h2>
            <p>We've sent a verification link to <br><strong id="userEmailDisplay"></strong>.</p>
            <p class="success-helper">Please verify your email address to activate your account and log in.</p>
            <a href="login.html" class="btn btn--primary full-width">Go to Login</a>
        </div>

    </div>
</main>

<script src="../js/signup.js"></script>
</body>
</html>
