<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Set a new password for your Nexus account.">
    <title>Reset Password - Nexus</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

<main class="auth-container">
    <div class="auth-card">
        <header class="auth-header">
            <a href="index.html" class="logo">
                <div class="logo-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M14 6L10 18M6 6H8L10 12L12 6H14V18H12L10 12L8 18H6V6Z" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <span class="logo-text">Nexus</span>
            </a>
            <h1>Set new password</h1>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 8px;">
                Please enter your new password below.
            </p>
        </header>

        <form id="resetPasswordForm" class="auth-form" novalidate>
            
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <div class="input-wrapper">
                    <input type="password" id="newPassword" name="newPassword" placeholder="Minimum 8 characters" required>
                    <button type="button" class="toggle-password" data-target="newPassword" aria-label="Show password">👁</button>
                </div>
                <span class="error-msg" id="newPasswordError" aria-live="polite"></span>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm New Password</label>
                <div class="input-wrapper">
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter new password" required>
                    <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="Show password">👁</button>
                </div>
                <span class="error-msg" id="confirmPasswordError" aria-live="polite"></span>
            </div>

            <button type="submit" id="submitBtn" class="btn btn--primary full-width" style="margin-top: 12px;">Reset Password</button>

            <div id="formStatus" class="form-status" role="alert"></div>
        </form>

        <footer class="auth-footer">
            <p>Remember your password? <a href="login.html" class="link-primary">Back to log in</a></p>
        </footer>
    </div>
</main>

<script src="../js/reset-password.js"></script>
</body>
</html>
