<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Log in to your Nexus workspace.">
    <title>Log in - Nexus</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

<main class="auth-container">
    <div class="auth-card">
        <header class="auth-header">
            <a href="index.html" class="logo">
                <div class="logo-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M14 6L10 18M6 6H8L10 12L12 6H14V18H12L10 12L8 18H6V6Z" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <span class="logo-text">Nexus</span>
            </a>
            <h1>Welcome back</h1>
        </header>

        <form id="loginForm" class="auth-form" novalidate>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email address" autocomplete="email" required>
                <span class="error-msg" id="emailError" aria-live="polite"></span>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                    <button type="button" class="toggle-password" data-target="password" aria-label="Show password">👁</button>
                </div>
                <span class="error-msg" id="passwordError" aria-live="polite"></span>
                <div style="text-align: right; margin-top: 4px;">
                    <a href="#" id="forgot-password-link" class="link-secondary" style="font-size: 0.85rem;">Forgot password?</a>
                </div>
            </div>

            <button type="submit" class="btn btn--primary full-width" style="margin-top: 12px;">Log in</button>

            <div id="formStatus" class="form-status" role="alert"></div>
        </form>

        <footer class="auth-footer">
            <p>Don't have an account? <a href="signup.html" class="link-primary">Sign up</a></p>
        </footer>
    </div>
</main>
<div id="forgot-password-modal" class="modal-overlay" style="display: none;">
    <div class="auth-card" style="padding: 32px; max-width: 400px; text-align: center; margin: 20px;">
        
        <div id="fp-form-state">
            <h2 style="font-size: 1.5rem; margin-bottom: 12px; color: var(--text-main);">Reset Password</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px;">
                Enter your email address and we'll send you a link to reset your password.
            </p>
            
            <input type="email" id="fp-email-input" placeholder="name@company.com" required
                   style="width: 100%; padding: 12px 16px; border-radius: var(--radius-sm); border: 1px solid var(--border-color); background: var(--bg-body); color: var(--text-main); font-size: 1rem; margin-bottom: 8px;">
            <div id="fp-error" class="error-msg" style="margin-bottom: 16px; min-height: 18px;"></div>
            
            <div style="display: flex; gap: 12px; justify-content: center;">
                <button class="btn btn--outline" id="btn-cancel-fp" style="flex: 1;">Cancel</button>
                <button class="btn btn--primary" id="btn-send-fp" style="flex: 1;">Send Link</button>
            </div>
        </div>

        <div id="fp-success-state" style="display: none;">
            <div style="font-size: 3rem; margin-bottom: 16px;">✉️</div>
            <h2 style="font-size: 1.5rem; margin-bottom: 12px; color: var(--text-main);">Check your email</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px;">
                We've sent a password reset link to <strong id="fp-success-email" style="color: var(--text-main);"></strong>.
            </p>
            <button class="btn btn--primary full-width" id="btn-close-fp">Back to Login</button>
        </div>

    </div>
</div>
<script src="../js/login.js"></script>
</body>
</html>
