<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Verified - Nexus</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

<main class="auth-container">
    <div class="auth-card" style="text-align: center; padding: 48px 32px;">
        
        <header class="auth-header" style="margin-bottom: 24px;">
            <div class="logo" style="justify-content: center;">
                <div class="logo-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M14 6L10 18M6 6H8L10 12L12 6H14V18H12L10 12L8 18H6V6Z" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
            </div>
        </header>

        <div style="font-size: 56px; margin-bottom: 16px; color: #10b981;">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin: 0 auto;">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
        </div>
        
        <h2 style="font-size: 1.75rem; margin-bottom: 12px; color: var(--text-main);">Payment Verified</h2>
        
        <p style="color: var(--text-muted); font-size: 1rem; margin-bottom: 8px;">
            Your subscription has been successfully activated.
        </p>
        
        <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 32px;">
            Redirecting to your dashboard in <strong id="countdown" style="color: var(--text-main); font-size: 1.1rem;">5</strong> seconds...
        </p>

        <button id="btn-go-dashboard" class="btn btn--primary full-width">Go to Dashboard Now</button>

    </div>
</main>

<script src="../js/payment-success.js"></script>
</body>
</html>
